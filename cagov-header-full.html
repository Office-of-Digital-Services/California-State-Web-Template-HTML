<style>
  :root {
  --font-size-base: 1rem;
  --font-size-regular: calc(var(--font-size-base, 1rem) * 1.125);
  --font-size-large: calc(var(--font-size-base, 1rem) * 1.4375);
  --font-size-h1: calc(var(--font-size-base, 1rem) * 2.9375);
  --font-size-h2: calc(var(--font-size-base, 1rem) * 2.3175);
  --font-family-sans-serif:
    "Public Sans", system-ui, -apple-system, "Segoe UI", "Roboto",
    "Helvetica Neue", "Noto Sans", sans-serif;
  --gray-900: #3b3a48;
  --gray-700: #5e5e6a;
  --gray-500: #72717c;
  --gray-200: #d4d4d7;
  --gray-150: #e2e2e3;
  --gray-100: #ededef;
  --gray-75: #f8f9fa;
  --gray-50: #fafafa;
  --black: #000;
  --white: #fff;
  --color-p1: #fdb81e;
  --color-p1-lighter: #fed478;
  --color-p1-soft: #f2c45a;
  --color-p1-softer: #f5ce73;
  --color-p2: #046b99;
  --color-p2-darker: #035376;
  --color-p2-darkest: #01395e;
  --color-p2-light: #6db7d8;
  --color-p2-pale: #eef8fb;
  --color-p2-soft: #f5f9fa;
  --color-p2-muted: #87b8ce;
  --color-p3: #323a45;
  --color-p3-darker: #232930;
  --outline-default-color: #0b8ee5;
  --outline-dark-mode-color: #85cbf9;
  --ratio: 0.1vw;
  --shadow-strong: 0 2px 4px rgba(0 0 0 / 50%);
  --shadow-card: 0 3px 5px 0 rgb(0 0 0 / 10%);
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* cagov shell styles */
div.cagov-header-full {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(
    --font-family-sans-serif,
    "Public Sans",
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    "Noto Sans",
    sans-serif
  );
  color: var(--gray-900, #3b3a48);

  /* global */

  :focus {
    outline: 2px solid var(--outline-default-color, #0b8ee5);
  }

  .bold {
    font-weight: 700;
  }

  & a {
    color: var(--color-p2, #046b99);

    &:hover,
    &:focus {
      color: var(--color-p2-darker, #035376);
    }
  }

  .cagov-sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  > div {
    > div {
      width: 100%;
      padding-right: 12px;
      padding-left: 12px;
      margin-right: auto;
      margin-left: auto;

      @media (width >= 576px) {
        max-width: 540px;
      }
      @media (width >= 768px) {
        max-width: 720px;
      }
      @media (width >= 992px) {
        max-width: 960px;
      }
      @media (width >= 1200px) {
        max-width: 1176px;
      }
    }
  }

  > div:first-child {
    background-color: var(--color-p2-soft, #f5f9fa);
    min-height: 42px;
  }

  > div:last-child {
    border-bottom: 2px solid var(--gray-150, #e2e2e3);
  }

  /* UTILITY BAR */
  > div:first-child > div {
    display: flex;
    gap: 0.5rem;
    flex-flow: column wrap;
    width: 100%;
    align-items: start;
    padding-top: 0.2rem;
    padding-bottom: 0.5rem;

    @media (width >= 300px) {
      flex-direction: row;
      align-items: center;
    }

    > div:nth-of-type(2) {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      position: relative;
      left: 0;
      margin-right: 0.5rem;

      @media (width >= 436px) {
        left: 0.3rem;
        flex-direction: row;
        margin-right: 0;
      }

      > a {
        color: var(--gray-900, #3b3a48);
        font-size: 0.95rem;
        display: flex;
        gap: 0.3rem;
        padding: 0.2rem 0;

        > svg {
          width: 1.3rem;
        }

        @media (width >= 436px) {
          padding: 0.2rem 0.3rem;
        }

        &:hover,
        &:focus {
          color: var(--black, #000);
        }
      }
    }

    > div:last-of-type > nav > ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      position: relative;
      left: 0.35rem;
      font-size: 0.95rem;

      > li > a {
        padding: 0.35rem 0;
      }

      @media (width >= 436px) {
        align-items: flex-end;
        justify-content: flex-end;

        > li > a {
          padding: 0.35rem;
        }
      }

      @media (width >= 540px) {
        flex-direction: row;
        gap: 1.5rem;
      }
    }

    > details:first-of-type {
      flex-grow: 1;
      flex-shrink: 0;

      > summary {
        font-size: 0.875rem;
        display: inline-block;
        width: fit-content;
        padding: 0.35rem 0.5rem 0.2rem;
        right: 0.5rem;
      }
    }

    > details:last-of-type > summary {
      font-size: 0.95rem;
      padding: 0.35rem 0.5rem;
      right: 0.5rem;

      @media (width >= 436px) {
        left: 0.2rem;
        padding: 0.35rem 0.3rem;
      }
    }

    > details:first-of-type,
    > details:last-of-type {
      > summary {
        list-style: none;
        text-decoration: underline;
        cursor: pointer;
        position: relative;

        &::after {
          margin-left: 0.5rem;
          content: "";
          display: inline-block;
          text-decoration: none;
          position: relative;
          top: -2px;
          width: 0.4rem;
          height: 0.4rem;
          border-top: 1px solid var(--black, #000);
          border-left: 1px solid var(--black, #000);
          transform: rotate(225deg);
          transition: 200ms;
          vertical-align: middle;
        }
      }

      + div {
        display: none;
        width: 100%;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        line-height: 1.5;
        font-size: 0.875rem;
        order: 0;

        @media (width >= 436px) {
          order: 1;
        }
      }

      &[open] {
        > summary::after {
          transform: rotate(45deg);
          top: 2px;
        }

        + div {
          display: block;
        }
      }
    }
  }

  /* BOTTOM BAR/BRANDING */
  /* stylelint-disable no-descending-specificity */
  > div:last-child > div {
    display: flex;
    justify-content: flex-start;
    flex-flow: column wrap;
    width: 100%;

    @media (width >= 300px) {
      flex-direction: row;
      align-items: center;
    }

    > div:first-of-type {
      flex-grow: 1;
      flex-shrink: 0;
      width: 100%;

      @media (width >= 336px) {
        width: auto;
      }

      > a {
        display: inline-block;

        > svg {
          padding: 1rem 0;
          max-width: 216px;
          width: 100%;
          height: auto;
          display: block;
        }
      }
    }

    > div:nth-of-type(2) {
      display: none;
      width: 100%;
      order: 1;

      @media (width >= 576px) {
        width: auto;
        display: block;
        order: 0;
      }

      > form {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding-top: 1rem;
        padding-bottom: 1rem;

        @media (width >= 576px) {
          max-width: 350px;
        }

        > label {
          position: absolute !important;
          width: 1px !important;
          height: 1px !important;
          padding: 0 !important;
          margin: -1px !important;
          overflow: hidden !important;
          clip: rect(0, 0, 0, 0) !important;
          white-space: nowrap !important;
          border: 0 !important;
        }

        > input[type="search"] {
          font-size: 1.1rem;
          width: 100%;
          max-height: 38px;
          padding: 0 10px;
          transition: border 0.4s;
          border: 1px solid var(--gray-500, #72717c);
          border-radius: 5px 0 0 5px;
          height: 38px;
          outline-offset: -2px;
        }

        > button[type="submit"] {
          display: flex;
          align-items: center;
          justify-content: center;
          outline-offset: -4px;
          outline-color: var(--outline-dark-mode-color, #85cbf9);
          background-color: var(--gray-500, #72717c);
          color: var(--white, #fff);
          border-radius: 0 5px 5px 0;
          padding: 0 12px;
          border: 1px solid var(--gray-500, #72717c);
          min-height: 38px;
          margin-left: -1px;

          > svg {
            fill: var(--white, #fff);
          }
        }
      }
    }

    > div:last-of-type {
      display: none;
      width: 100%;
      position: relative;

      &::before,
      &::after {
        content: "";
        position: absolute;
        top: 0;
        width: 1000%;
        height: 0;
        outline: 1px solid var(--gray-150, #e2e2e3);
        box-shadow: none;
        z-index: 1;
        pointer-events: none;
      }

      &::before {
        right: 50%;
      }

      &::after {
        left: 50%;
      }

      @media (width >= 576px) {
        display: block;
      }

      > nav {
        position: relative;

        @media (width >= 576px) {
          left: -1rem;
        }

        > ul {
          list-style: none;
          padding: 0;
          margin: 0;
          display: flex;
          flex-direction: column;

          @media (width >= 576px) {
            flex-direction: row;
          }

          > li {
            > a {
              font-size: 1.1rem;
              padding: 0.85rem 1rem 0.9rem;
              display: block;
              text-decoration: none;
              margin-left: -1rem;
              margin-right: -1rem;
              border-top: 1px solid var(--gray-200, #d4d4d7);

              &:hover,
              &:focus {
                background-color: var(--gray-50, #fafafa);
              }

              &:focus {
                outline-offset: -2px;
              }

              @media (width >= 576px) {
                margin-left: 0;
                margin-right: 0;
              }

              @media (width >= 768px) {
                font-size: 1.125rem;
              }
            }

            &:first-child > a {
              border-top: none;
            }
          }
        }
      }
    }

<script>
   //@ts-check
document.addEventListener("DOMContentLoaded", () => {
  // Polyfill to support grouping <details> elements via the NAME property.
  // Safaroi 16.5 and earlier do not support details.name

  // Test to see if browser supports details.name
  const test = document.createElement("details");
  test.setAttribute("name", "x");
  const supportsName = test.name === "x";

  if (!supportsName) {
    /**
     * Selects all <details> elements that have a NAME attribute.
     * @type {NodeListOf<HTMLDetailsElement>}
     */
    const accordions = document.querySelectorAll("details[name]");
    accordions.forEach(details => {
      details.addEventListener("toggle", () => {
        if (details.open) {
          accordions.forEach(other => {
            if (
              other.open &&
              other !== details &&
              other.getAttribute("name") === details.getAttribute("name")
            ) {
              other.open = false;
              console.log("POLYFILL: details.name closed");
            }
          });
        }
      });
    });
  }
  // End details.name polyfill
});
 
</script>
